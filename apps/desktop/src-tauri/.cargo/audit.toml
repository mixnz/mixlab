# What `cargo audit` is told to pass over, and why. Read by the Advisories workflow.
#
# An ignore here is a claim, not a shrug: each one says why this advisory cannot reach a user of
# MixLab, and it is meant to be deleted the moment that stops being true. Anything not listed fails
# the check — which is the only way the check is worth running at all.

[advisories]
ignore = [
  # `rsa` 0.10.0-rc — the Marvin timing side-channel, and there is no fixed version to move to.
  # It arrives under `russh`, which is the SSH tunnel and the terminal. The attack recovers a
  # private key from an attacker who can time many decryptions with it; MixLab is the client, it
  # decrypts nothing for anyone, and the far end that would have to be doing the timing is the SSH
  # server the user chose to trust with a shell. Delete this line the day russh ships a fix.
  "RUSTSEC-2023-0071",

  # `rkyv` 0.7 — out-of-bounds reads on a malformed archive. MixLab does not build this crate at
  # all: it is an optional dependency of `rust_decimal` whose feature nothing turns on, so it sits
  # in Cargo.lock and appears in no dependency graph. Checked, not assumed — `cargo tree -e all -i
  # rkyv --target all` prints nothing. cargo-audit reads the lock file, which cannot see that.
  "RUSTSEC-2026-0235",

  # `rustls-webpki` 0.101 — name constraints accepted for wildcard and URI names, and a panic
  # parsing a certificate revocation list. It arrives under `tiberius`'s `rustls` feature, which
  # only macOS builds turn on (see Cargo.toml), and tiberius 0.12.3 is the latest, pinned to
  # rustls 0.21. None of the three is reached: `drivers/mssql.rs` always calls `trust_cert()`,
  # which swaps webpki's certificate verification for tiberius' `NoCertVerifier` — it accepts
  # without calling webpki — and nothing in tiberius parses a CRL. Delete these the day tiberius
  # moves to a rustls whose webpki is fixed, or the day SQL Server certificates get verified.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  # 0382 — certificate paths through the distrusted emSign intermediates — is the same road and is
  # not reached for the same reason: `NoCertVerifier` builds no path. The 0.103 line it also names
  # is updated past it (0.103.16), so this ignore covers only tiberius' 0.101.
  "RUSTSEC-2026-0382",

  # `rustls` 0.21 — the same road in: tiberius 0.12.3 pins it, on macOS only, through
  # `tokio-rustls` 0.24, and the fix is a 0.23 release that line will never get. Neither is reached.
  # 0346 leaks secrets through the `Debug` of a client session value, which only a
  # `ClientSessionStore` of one's own would ever format; neither tiberius nor MixLab has one. 0349
  # downgrades later connections to classical key exchange, which is the only kind rustls 0.21
  # does — and `trust_cert()` already accepts any certificate, so it weakens nothing that holds.
  # Delete these with the three above, the day tiberius moves to a current rustls.
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0349",
]
