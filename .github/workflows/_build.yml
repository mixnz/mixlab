# `window` and `binaries`, then `build`.
# Called from ci.yml, and from release-rehearsal.yml for its weekly `release-exact` build; never run
# on its own. The triggers, the `jobs` choice and concurrency live in the caller.
# `inputs.jobs` and `inputs.profile` below are the caller's choices, passed through.
name: build

on:
  workflow_call:
    inputs:
      jobs:
        type: string
        default: ''
      # `release-exact` asks these three jobs to build what a tag builds. Empty is `branch`,
      # so a caller that does not know about this input gets what it always got.
      profile:
        type: string
        default: branch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds are never incremental: it only costs cache size and hurts a cold runner.
  CARGO_INCREMENTAL: 0
  # Line tables only in debug builds. Set in every workflow rather than per job because
  # rust-cache hashes the `CARGO_*` environment into its key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  # `window` and `binaries` build on runners of their own, and `build` packages what they
  # hand on. The three matrices must stay the same five rows.
  window:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed. The `build` option covers all
    # three jobs.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # One Tauri release build, twice over on macOS for the two slices. Measured at 8 to 17 minutes
    # cold in run 35458805745; there is no cache to make it warm.
    timeout-minutes: 45
    strategy:
      # An artifact that failed to build on one system is not a reason to stop producing the other
      # four — the same rule `test` and `bench` state one job up.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          # Native, not cross. GitHub's own arm64-hosted runners exist and are free for this
          # (public) repository, so this leg is the same shape as the row above rather than a
          # cross-compilation of it — see the design's "Measured, not assumed".
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          # The binaries in a manylinux_2_28 container for an older glibc; the window on the 22.04
          # host, because manylinux's WebKitGTK is too old for Tauri 2.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile
        with:
          profile: ${{ inputs.profile }}

      # Before anything compiles, and after checkout because the action reads the workspace's path.
      # Nothing on the three legs that are not Windows.
      - uses: ./.github/actions/defender-aside

      # On every leg, the Linux ones included: the window is built on the runner itself, never in
      # the container.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # **No Actions cache.** This job's release artifacts, with `binaries`', are several GB, and
      # with them one `master` run writes more than the repository's 10 GB, so `master`'s own
      # entries would evict each other and every job would build cold.

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the libraries the window links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      # The window, through `packaging/desktop.sh` — which runs `npm ci`, `cargo tauri build`
      # (`--bundles app` on macOS, where a webview application is a `.app` directory), adds the
      # macOS slices itself, exports `MIXENGINE_RELEASE` and asserts what it produced.
      - name: Build the window
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          # A repository variable, not a committed line — `gh variable set MIX_TIMINGS 1` turns the
          # report on for the next run and `gh variable delete` turns it off again, so measuring
          # this job costs no commit in either direction.
          MIX_TIMINGS: ${{ vars.MIX_TIMINGS }}
        run: bash packaging/desktop.sh

      # Where the build's minutes went, when somebody asked. `if-no-files-found: error` because a
      # measurement that quietly uploaded nothing is the failure this whole task exists to avoid.
      - uses: actions/upload-artifact@v4
        if: vars.MIX_TIMINGS == '1'
        with:
          name: timings-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/**/cargo-timings/cargo-timing*.html
          if-no-files-found: error
          retention-days: 14

      # The window's half of `binaries`' x86_64 check, after the build above because
      # `tauri::generate_context!` reads the frontend it built at compile time.
      - name: Compile the window for x86_64 as well
        if: runner.os == 'macOS' && env.MIX_MACOS_SLICES == 'aarch64'
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          MIXENGINE_RELEASE=1 cargo check --release --locked --target x86_64-apple-darwin

      # **A tar, not the files.** `upload-artifact` keeps neither file modes nor symlinks: the
      # window would arrive not executable, and a macOS bundle does not survive the trip without its
      # links. The tar holds `window/<key>/…`, relative to `target/packaging`, which is where
      # `build` unpacks it and where `stage.sh` looks.
      - name: Hand the window on
        shell: bash
        run: tar -cf window.tar -C target/packaging window

      # Kept 14 days, like `desktop-<os>` before it: a window someone wants to try without the
      # installer is a reason to download one.
      - uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: window.tar
          if-no-files-found: error
          retention-days: 14

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  binaries:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The four headless binaries, in release: twice on macOS for the two slices, and from scratch
    # inside a container on both Linux legs, where no cache would reach anyway.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # `window`'s five rows; the comments are there.
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile
        with:
          profile: ${{ inputs.profile }}

      # As in `window` above.
      - uses: ./.github/actions/defender-aside

      # Only the legs that build on the runner itself rather than inside a container: the two Linux
      # legs install their own pinned toolchain inside `stage.sh --container`'s `docker run`, since
      # nothing installed here is visible from there.
      - name: Install pinned toolchain
        if: matrix.container == ''
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Fetch dependencies
        if: matrix.container == ''
        run: cargo fetch --locked

      # `stage.sh --build-only`: the compile half of what the per-OS packaging scripts used to do,
      # with the same flags — `MIXENGINE_RELEASE`, `crt-static` on Windows, the container on Linux —
      # because it is the same file doing it.
      - name: Build the binaries
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            source packaging/common.sh
            slices="$(mix_macos_slices)"
            for slice in $slices; do
              rustup target add "$slice-apple-darwin"
              bash packaging/stage.sh --build-only --target "$slice-apple-darwin"
            done
          else
            args=(--build-only --target "$MIX_TARGET")
            if [ -n "$MIX_CONTAINER" ]; then
              args+=(--container "$MIX_CONTAINER")
            fi
            bash packaging/stage.sh "${args[@]}"
          fi

      # A branch that builds only `aarch64` would otherwise stop noticing code that does not compile
      # for Intel Macs until a tag. `check` over the same `-p` list `stage.sh` builds, with
      # `MIXENGINE_RELEASE` as it sets it: it proves the code compiles for x86_64 without paying for
      # a second release build. Linking that slice and `lipo` are left to `master`.
      - name: Compile for x86_64 as well
        if: runner.os == 'macOS' && env.MIX_MACOS_SLICES == 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          source packaging/common.sh
          rustup target add x86_64-apple-darwin
          packages=()
          for crate in "${MIX_CRATES[@]}"; do
            if [ "$crate" != "$MIX_WINDOW" ]; then
              packages+=(-p "$crate")
            fi
          done
          MIXENGINE_RELEASE=1 cargo check --release --locked --target x86_64-apple-darwin "${packages[@]}"

      # Whether this runner's toolchain makes a binary that runs, asked of the one just built.
      - name: Smoke test this leg's toolchain
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: '"target/${{ matrix.target }}/release/mix.exe" --version'

      # A tar for the reason `window` gives, of exactly the binaries `common.sh` names and nothing
      # else of cargo's: `build` fails on any trace of a compile in its tree, and `deps/` or
      # `.fingerprint/` arriving in this tar would be one.
      - name: Hand the binaries on
        shell: bash
        run: bash .github/scripts/binaries-hand-on.sh

      # One day: it exists to reach `build` in the same run, and nobody installs from it.
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: binaries.tar
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  build:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: build (${{ matrix.os }})
    # **The whole of both matrices, not this leg's row** — Actions has no per-leg `needs`, so every
    # leg here waits for the slowest `window` or `binaries` anywhere. Accepted in
    # `docs/specs/2026-09-20-t171-a-build-that-fans-out-design.md` (E1): the run ends with its
    # slowest leg either way, and five matrix-free copies of this job would cost more to keep than
    # the minutes they save.
    needs: [window, binaries]
    runs-on: ${{ matrix.os }}
    # Packaging and the two probes, nothing compiled: about three to five minutes. The ceiling is
    # generous because the macOS probe installs a `.pkg` for real.
    timeout-minutes: 30
    # `actions: read` for "The whole path", which asks the jobs API when `window` and `binaries`
    # started.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # `window`'s five rows; the comments are there.
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile
        with:
          profile: ${{ inputs.profile }}

      # From this run only, which is `download-artifact`'s default and never overridden here: an
      # artifact belongs to the commit its run built.
      - uses: actions/download-artifact@v4
        with:
          name: window-${{ matrix.os }}

      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.os }}

      # Back where the two builds left them, so every packaging script below runs as it would after
      # compiling here — with `MIX_PREBUILT` telling `stage.sh` that it must not.
      - name: Put both where their builds left them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/packaging
          tar -xf window.tar -C target/packaging
          tar -xf binaries.tar
          rm window.tar binaries.tar
          echo "MIX_PREBUILT=1" >> "$GITHUB_ENV"

      # `rpmbuild` is not on the ubuntu image.
      - name: Install the packaging tools this runner is missing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      # NSIS is not on the windows image; Chocolatey puts it where `packaging/windows/build.sh` looks.
      # The community feed answers 504 now and then, and choco reports "installed 0/0" with exit 0,
      # so the step retries and then checks for the binary itself instead of trusting choco.
      - name: Install the packaging tools this runner is missing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          for attempt in 1 2 3 4; do
            choco install nsis --no-progress --yes || true
            [ -x "$makensis" ] && exit 0
            echo "nsis is not installed after attempt $attempt; waiting before the next one"
            sleep $((attempt * 20))
          done
          echo "::error title=NSIS not installed::Chocolatey did not install nsis after 4 attempts (the community feed may be down)"
          exit 1

      - name: Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
        run: bash packaging/windows/build.sh

      - name: macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/build.sh

      # The Mark-of-the-Web and quarantine readings of this leg's artifacts; `windows-latest` alone.
      # `MIX_PROBE_INSTALL` installs for real and puts the machine back.
      - name: What an unsigned release shows SmartScreen
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_PROBE_INSTALL: "1"
        run: bash packaging/windows/probe.sh

      - name: What an unsigned release shows Gatekeeper
        if: runner.os == 'macOS'
        shell: bash
        env:
          MIX_PROBE_INSTALL: "1"
        run: bash packaging/macos/probe.sh

      - name: Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          bash packaging/linux/build-deb.sh
          bash packaging/linux/build-rpm.sh

      # For a person reading the log rather than for the gate: every script has already opened what
      # it made and refused if a binary was missing from it.
      - name: What this leg produced
        shell: bash
        run: ls -l target/packaging/dist

      - uses: actions/upload-artifact@v4
        with:
          name: mixengine-${{ matrix.os }}
          path: target/packaging/dist/*
          if-no-files-found: error
          retention-days: 14

      # **The fan-out's tripwire.** The two tars carry finished binaries and nothing of cargo's, so
      # a `deps` or `.fingerprint` directory, or the window's own `target`, exists here only if
      # something compiled in this job. `stage.sh` refuses to under `MIX_PREBUILT`; this is for
      # whatever else might start to, since the result would be a green job exactly as slow as
      # before the build fanned out.
      - name: Nothing was compiled here
        if: always()
        shell: bash
        run: |
          found="$(find target -maxdepth 4 \( -name deps -o -name .fingerprint \) 2>/dev/null || true)"
          if [ -d apps/desktop/src-tauri/target ]; then
            found="$found apps/desktop/src-tauri/target"
          fi
          if [ -n "${found// /}" ]; then
            echo "::error title=Compiled in build::cargo left $found; this job packages what window and binaries built and compiles nothing"
            exit 1
          fi

      # What a person waits for is the path, not this job: from the first of `window` and `binaries`
      # starting to here. Read from the jobs API so neither has to pass a timestamp along.
      - name: The whole path
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          first="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq \
            "[.jobs[] | select((.name | endswith(\"window ($OS)\")) or (.name | endswith(\"binaries ($OS)\"))) | .startedAt | fromdate] | min")"
          elapsed=$(( $(date +%s) - first ))
          printf 'build path (%s): %dm%02ds, target 18 minutes.\n' "$OS" $((elapsed / 60)) $((elapsed % 60)) >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt $((18 * 60)) ]; then
            echo "::notice title=Path over its target::window, binaries and build took $((elapsed / 60)) minutes against a target of 18."
          fi

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "5"
          ceiling-minutes: "30"
