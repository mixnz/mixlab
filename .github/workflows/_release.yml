# Signing and the draft release, on a tag only (T86).
# Called from ci.yml, never run on its own (T172e); the triggers, the `jobs` choice and
# concurrency live there. `inputs.jobs` below is the caller's choice, passed through.
name: release

on:
  workflow_call:
    inputs:
      jobs:
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds are never incremental: it only costs cache size and hurts a cold runner.
  CARGO_INCREMENTAL: 0
  # T170l: line tables only in debug builds. Set in every workflow rather than per job because
  # rust-cache hashes the `CARGO_*` environment into its key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  # T86, D4: signing happens once, here. `needs` omits `system` and `bench`: a person reads them,
  # and they do not gate.
  release:
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (inputs.jobs == '' || inputs.jobs == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign

      # `mixengine-*` and nothing else. Since T171 a run also carries each leg's `window-<os>` and
      # `binaries-<os>`, which are what `build` was made from and not release files, and the gather
      # below would move them into `dist` along with the rest.
      - uses: actions/download-artifact@v4
        with:
          path: legs
          pattern: mixengine-*

      # Five uploads into one directory. `merge-multiple` would let a name that appears twice be one
      # artifact silently replacing another, and "silently" is the word that rules it out.
      - name: Gather what the five legs built
        run: |
          set -euo pipefail
          dist="target/packaging/dist"
          mkdir -p "$dist"
          for file in legs/*/*; do
            name="$(basename "$file")"
            if [ -e "$dist/$name" ]; then
              echo "two build legs produced $name" >&2
              exit 1
            fi
            mv "$file" "$dist/$name"
          done
          ls -l "$dist"

      # T56: the contract, packed from the committed tree, before signing so that it is signed.
      - name: Pack the published API contract
        run: bash packaging/bindings.sh --pack

      # T88. The feed lists the payload archives of every leg, and no build leg can see the other
      # four — so it is written here, and it is written *before* the step below, which is what puts
      # `latest.json.minisig` beside it under the name an installed MixEngine appends.
      - name: Write the update feed
        run: bash packaging/feed.sh --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Sign every artifact
        env:
          MIX_SIGN_SECRET_KEY: ${{ secrets.UPDATE_SECRET_KEY }}
          MIX_SIGN_PASSWORD: ${{ secrets.UPDATE_PASSWORD }}
        run: bash packaging/sign.sh
      - name: Every file the install scripts can choose is in this release (T197)
        run: bash .github/scripts/install-names.sh "${GITHUB_REF_NAME#v}" target/packaging/dist

      # A draft, which a person publishes. The unsigned-binary warning goes at the top of the notes.
      - name: Assemble the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes_header="$(printf '%s\n' \
              '### Installation notes' \
              '' \
              "Nothing is code-signed or notarised, by design: expect SmartScreen on Windows and Gatekeeper's" \
              '"Open Anyway" on macOS. A machine with Smart App Control enforcing is not supported. On ARM64' \
              'Windows some runtimes have no build of their own and run under emulation, marked `emulated` in' \
              '`mix runtime available`.')"
            gh release create "$GITHUB_REF_NAME" \
              --draft --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "$notes_header"
          fi
          gh release upload "$GITHUB_REF_NAME" target/packaging/dist/* --clobber

      # T79a's D5, one repository along: *created* and *published* are different claims, and an
      # upload that clobbered the wrong asset is exactly what the second check catches.
      - name: Verify what was published, and not only what was signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-verify.sh

      - name: Where it is
        run: |
          echo "A draft release is waiting at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" \
            "— review it and publish it by hand." >>"$GITHUB_STEP_SUMMARY"
