# What cargo puts in the environment of everything it runs here.
#
# Design: docs/specs/2026-09-05-t56-the-published-api-contract-design.md
#
# `ts-rs` reads both of these at run time, so putting them here rather than in
# `packaging/bindings.sh` means the obvious command — `cargo test -p mixengine-proto --features ts`
# — produces exactly the committed answer. A script that exported them itself would be a second way
# of being right and a first way of being wrong, and a generator whose answer depends on how it was
# invoked is not one a CI job can check.
#
# Neither entry is `force = true`, so a variable already in the environment still wins: that is how
# `packaging/bindings.sh --check` points one run at a temporary directory.
#
# **No flags, no target, no registry.** This file cannot quietly change how anything is built.
[env]
# Relative to the directory holding this `.cargo/`, which is the repository root whatever the
# working directory is.
TS_RS_EXPORT_DIR = { value = "bindings", relative = true }
# `ts-rs` maps `i64`/`u64`/`i128`/`u128` to `bigint` by default, which is right for a codec that can
# produce one. `JSON.parse` cannot: it answers `number` for every JSON number there has ever been,
# so a binding that said `bigint` would fail to type-check against the value it describes. The `u64`s
# on this wire are milliseconds, byte counts and counts of things on one machine; the largest of them
# reaches 2^53 in about 285,000 years.
TS_RS_LARGE_INT = "number"

# **A daemon built here must not open the MixEngine somebody is running their real projects with.**
#
# ADR 0024 gives a development build its own default home beside the released one; this entry goes
# one step further and keeps a checkout's daemon inside the checkout, so that the window's daemon
# and a terminal's `cargo run` are one daemon, and `cargo clean` does not reach it.
#
# `.mixengine-home` and **not** anything under `target/`, which is the first place this was written:
# `cargo clean` empties that directory, and a home is where runtimes land — gigabytes of downloaded
# PHP and Node beside the sites and services that refer to them. `.gitignore` has carried
# `/.mixengine-home/` for sandbox roots since before this file did.
#
# **A suggestion, not `MIXENGINE_HOME`** — ADR 0040. It was `MIXENGINE_HOME` until a checkout on an
# external disk put `run/` where macOS will not let the elevated helper read its own request, and
# every Allow on the prompt ended in *no report*. `mix`, `mixengined` and the window now weigh this
# in `mixengine_platform::home::development_home`: taken unless an elevated process could not read
# it there, in which case the default home (`MixEngine-dev`) is used and a warning names what was
# passed over. A release build ignores it.
#
# `MIXENGINE_HOME` and `--home` still beat it, for a person who chose.
MIXENGINE_DEV_HOME = { value = ".mixengine-home", relative = true }
