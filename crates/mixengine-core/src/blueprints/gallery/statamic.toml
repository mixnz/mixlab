schema = 1

[blueprint]
name = "Statamic"
description = "Statamic on PHP-FPM, flat files and no database"
created_at = "2026-10-08T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"
composer = "2"

[site]
kind = "php-fpm"
doc_root = "public"
https = true
domain_pattern = "{project}.test"

[scaffold]
command = "composer create-project statamic/statamic . --no-interaction"
needs_empty_dir = true

[[next_steps]]
kind = "once"
run = "php please make:user"
optional = true

[[next_steps]]
kind = "open"
path = "/cp"
