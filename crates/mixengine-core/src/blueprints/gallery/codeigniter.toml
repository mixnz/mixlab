schema = 1

[blueprint]
name = "CodeIgniter"
description = "CodeIgniter 4 on PHP-FPM with MySQL"
created_at = "2026-10-08T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"
composer = "2"

[site]
kind = "php-fpm"
doc_root = "public"
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mysql"
instance = "main"
database = "{project}"
user = "{project}"

[scaffold]
command = "composer create-project codeigniter4/appstarter . --no-interaction"
needs_empty_dir = true
