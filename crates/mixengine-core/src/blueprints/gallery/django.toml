schema = 1

[blueprint]
name = "Django"
description = "Django behind a reverse proxy, with PostgreSQL"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
python = "3.13"

[site]
kind = "reverse-proxy"
upstream = "http://127.0.0.1:8000"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "postgres"
instance = "main"
database = "{project}"
user = "{project}"

[[next_steps]]
kind = "once"
run = "python -m pip install django"
note = "Installs into the runtime this project pins, which its other projects share."

[[next_steps]]
kind = "once"
run = "python -m django startproject --template https://github.com/mixnz/mixengine-packages/releases/download/blueprints/django-starter.zip config ."
note = "Django's own project template, with the .test domain in ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS."

[[next_steps]]
kind = "serve"
run = "python manage.py runserver 127.0.0.1:8000"
