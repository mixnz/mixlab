schema = 2

[blueprint]
name = "Django"
description = "Django behind a reverse proxy, with PostgreSQL"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
python = "3.13"

[site]
kind = "reverse-proxy"
upstream = "http://127.0.0.1:8000"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "postgres"
instance = "main"
database = "{project}"
user = "{project}"
dotenv = "DATABASE_URL"

[[next_steps]]
kind = "once"
run = "python -m pip install django psycopg psycopg-binary"
note = "Installs into the runtime this project pins, which its other projects share. On Windows ARM64 there is no psycopg-binary yet: install Django alone with python -m pip install django, and leave the .env box unticked to stay on SQLite."

[[next_steps]]
kind = "once"
run = "python -m django startproject --template https://github.com/mixnz/mixengine-packages/releases/download/blueprints/django-starter.zip config ."
note = "Django's own project template, with the .test domain allowed, and the database read from DATABASE_URL in .env when MixEngine wrote it."
credentials = true

[[next_steps]]
kind = "serve"
run = "python manage.py runserver 127.0.0.1:8000"
