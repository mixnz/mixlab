schema = 1

[blueprint]
name = "Laravel"
description = "Laravel on PHP-FPM, with MariaDB and Redis"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"
node = "24"
composer = "2"

[site]
kind = "php-fpm"
doc_root = "public"
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mariadb"
instance = "main"
database = "{project}"
user = "{project}"

[[services]]
name = "redis"
instance = "main"

[php]
extensions = ["redis"]

[scaffold]
command = "composer create-project laravel/laravel . --no-interaction"
needs_empty_dir = true

[[next_steps]]
kind = "once"
run = "php artisan migrate"
note = "Laravel starts on SQLite; set DB_* in .env to the database below first."
optional = true
credentials = true

[[next_steps]]
kind = "serve"
run = "npm run dev"
note = "Vite, for editing the front end."
optional = true
