schema = 1

[blueprint]
name = "Yii"
description = "Yii 2 on PHP-FPM with MariaDB, served from web/"
created_at = "2026-10-08T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"
composer = "2"

[site]
kind = "php-fpm"
doc_root = "web"
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mariadb"
instance = "main"
database = "{project}"
user = "{project}"

[scaffold]
command = "composer create-project yiisoft/yii2-app-basic . --no-interaction"
needs_empty_dir = true
