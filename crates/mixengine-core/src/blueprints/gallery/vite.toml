schema = 1

[blueprint]
name = "Vite"
description = "A Vite build served as files over HTTPS, from dist/"
created_at = "2026-09-13T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
node = "24"

[site]
kind = "static"
doc_root = "dist"
https = true
domain_pattern = "{project}.test"

[[next_steps]]
kind = "once"
run = "npm create vite@latest ."
note = "It asks which framework; answer in the tab."

[[next_steps]]
kind = "once"
run = "npm install"

[[next_steps]]
kind = "once"
run = "npm run build"
note = "The site serves dist/, which this writes."
