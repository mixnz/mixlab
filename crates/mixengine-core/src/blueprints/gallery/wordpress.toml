schema = 2

[blueprint]
name = "WordPress"
description = "WordPress on PHP-FPM with MariaDB"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"

[site]
kind = "php-fpm"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mariadb"
instance = "main"
database = "{project}"
user = "{project}"

[scaffold]
archive = "https://wordpress.org/latest.zip"
strip = "wordpress"
needs_empty_dir = true

[[next_steps]]
kind = "open"
path = "/wp-admin/install.php"
credentials = true
