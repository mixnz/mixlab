schema = 1

[blueprint]
name = "Laravel + MongoDB"
description = "Laravel on PHP-FPM, with MongoDB (MongoDB needs a processor with AVX)"
created_at = "2026-09-17T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"
node = "24"
composer = "2"

[site]
kind = "php-fpm"
doc_root = "public"
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mongodb"
instance = "main"

[php]
extensions = ["mongodb"]

[scaffold]
command = "composer create-project laravel/laravel . --no-interaction"
needs_empty_dir = true

[[next_steps]]
kind = "once"
run = "composer require mongodb/laravel-mongodb"
note = "MongoDB's driver for Eloquent."
optional = true
