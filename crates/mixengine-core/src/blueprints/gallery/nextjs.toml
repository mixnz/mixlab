schema = 1

[blueprint]
name = "Next.js"
description = "A Next.js dev server on port 3000, served over HTTPS"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
node = "24"

[site]
kind = "node-app"
port = 3000
doc_root = ""
https = true
domain_pattern = "{project}.test"

[scaffold]
command = "npx --yes create-next-app@latest . --yes"
needs_empty_dir = true
needs_npm_safe_dir = true

[[next_steps]]
kind = "serve"
run = "npm run dev"
note = "Next.js listens on 3000; a second project on that port will not start."
