schema = 1

[blueprint]
name = "Express + MongoDB"
description = "A Node.js server on port 3000, with MongoDB (MongoDB needs a processor with AVX)"
created_at = "2026-09-17T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
node = "24"

[site]
kind = "node-app"
port = 3000
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mongodb"
instance = "main"

[[next_steps]]
kind = "once"
run = "npm init -y"

[[next_steps]]
kind = "once"
run = "npm install express mongodb"

[[next_steps]]
kind = "serve"
run = "node index.js"
note = "Write index.js first; it listens on 3000."
