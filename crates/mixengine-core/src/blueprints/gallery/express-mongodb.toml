schema = 2

[blueprint]
name = "Express + MongoDB"
description = "A Node.js server on port 3000, with MongoDB (MongoDB needs a processor with AVX)"
created_at = "2026-09-17T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
node = "24"

[site]
kind = "node-app"
port = 3000
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mongodb"
instance = "main"

[scaffold]
archive = "https://github.com/mixnz/mixengine-packages/releases/download/blueprints/express-mongodb-starter.zip"
strip = "express-mongodb"
needs_empty_dir = true

[[next_steps]]
kind = "once"
run = "npm install"

[[next_steps]]
kind = "serve"
run = "npm start"
note = "Express on 3000. If MongoDB is not on 27017, set MONGODB_URI to mongodb://127.0.0.1:port/database first."
