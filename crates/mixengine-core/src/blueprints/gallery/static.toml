schema = 2

[blueprint]
name = "Static site"
description = "Files served over HTTPS, with nothing running"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[site]
kind = "static"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[scaffold]
archive = "https://github.com/mixnz/mixengine-packages/releases/download/blueprints/static-starter.zip"
strip = "static"
when_empty = true
